#cloud-config
# Receipts GPU VM (the Glimmer arm). Generated by `receipts eval vm-files`; do not edit by hand.
# Any process on the VM can read this user data through instance metadata: nothing secret belongs here.
write_files:
  - path: /opt/receipts/check-imds.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Exits 0 only when this VM has no instance role and IMDSv1 is off. Generated by `receipts eval cloud-init`.
      set -uo pipefail
      M=http://169.254.169.254/latest
      TOKEN=$(curl -sS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' "$M/api/token") \
        || { echo "no IMDSv2 token"; exit 1; }
      role=$(curl -s -o /dev/null -w '%{http_code}' -H "X-aws-ec2-metadata-token: $TOKEN" \
        "$M/meta-data/iam/security-credentials/")
      [ "$role" = "404" ] || { echo "an instance role is attached (iam/security-credentials answered $role)"; exit 1; }
      v1=$(curl -s -o /dev/null -w '%{http_code}' "$M/meta-data/")
      [ "$v1" = "401" ] || { echo "IMDSv1 answered $v1; launch with HttpTokens=required"; exit 1; }
      echo "imds ok: no instance role, IMDSv1 off"
  - path: /opt/receipts/check-no-ssm.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Exits 0 only when no Systems Manager agent is installed or running (REG-562). Generated by `receipts eval cloud-init`.
      set -uo pipefail
      if snap list amazon-ssm-agent > /dev/null 2>&1; then echo "the amazon-ssm-agent snap is installed"; exit 1; fi
      if pgrep -f amazon-ssm-agent > /dev/null 2>&1; then echo "an SSM agent process is running"; exit 1; fi
      echo "no SSM agent"
  - path: /opt/receipts/gpu-bootstrap.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Receipts GPU VM bootstrap (lane eval, the Glimmer arm), first boot only. Generated by `receipts eval vm-files`.
      set -euo pipefail
      R=/opt/receipts
      exec > >(tee -a "$R/bootstrap.log") 2>&1
      fail() { echo "BOOTSTRAP FAILED: $*" | tee "$R/BOOT_FAILED"; exit 1; }
      rm -f "$R/READY" "$R/BOOT_FAILED"
      bash "$R/check-imds.sh" || fail "the instance metadata check failed"
      if snap list amazon-ssm-agent > /dev/null 2>&1; then
        snap remove --purge amazon-ssm-agent || fail "could not remove the SSM agent snap"
      fi
      if systemctl list-unit-files amazon-ssm-agent.service > /dev/null 2>&1; then
        systemctl disable --now amazon-ssm-agent.service || true
        apt-get purge -y amazon-ssm-agent || true
      fi
      bash "$R/check-no-ssm.sh" || fail "a Systems Manager agent is still on this VM"
      nvidia-smi -L | grep -q 'RTX PRO 6000' || fail "no RTX PRO 6000 GPU on this VM"
      docker pull -q docker.io/vllm/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635 > /dev/null || fail "could not pull the pinned vLLM image"
      docker run --rm --gpus all --entrypoint nvidia-smi docker.io/vllm/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635 -L | grep -q 'RTX PRO 6000' \
        || fail "a container cannot reach the GPU (NVIDIA container toolkit)"
      mkdir -p /opt/models
      docker run --rm --entrypoint python3 -v /opt/models:/models -e HF_HUB_DISABLE_TELEMETRY=1 docker.io/vllm/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635 -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="meta-models/Muse-Glimmer-30B", revision="cec94fcfd6512f2cfe708138c32533b346ea4f69", local_dir="/models/glimmer")' || fail "could not download meta-models/Muse-Glimmer-30B at cec94fcfd651"
      docker run --rm --entrypoint python3 -v /opt/models:/models -e HF_HUB_DISABLE_TELEMETRY=1 docker.io/vllm/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635 -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="meta-models/Muse-Glimmer-30B-assistant", revision="c676cce91658f9568aaf264a416211e2782735b7", local_dir="/models/glimmer-assistant")' || fail "could not download meta-models/Muse-Glimmer-30B-assistant at c676cce91658"
      docker rm -f glimmer > /dev/null 2>&1 || true
      docker run -d --name glimmer --restart unless-stopped --gpus all --ipc=host -p 8000:8000 \
        -v /opt/models:/models:ro -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e HF_HUB_DISABLE_TELEMETRY=1 \
        docker.io/vllm/vllm-openai@sha256:2286e8533ca8b6bc777594bae30524f1426ba46ca21797524e06df6a94b06635 --model /models/glimmer --served-model-name muse-glimmer-30b --dtype bfloat16 --tensor-parallel-size 1 --max-model-len 131072 --gpu-memory-utilization 0.92 --max-num-seqs 32 --enable-auto-tool-choice --tool-call-parser muse_glimmer --generation-config auto --speculative-config '{"method": "dflash", "model": "/models/glimmer-assistant", "num_speculative_tokens": 15}' --host 0.0.0.0 --port 8000 > /dev/null || fail "could not start vLLM"
      for _ in $(seq 1 160); do
        if curl -fsS "http://127.0.0.1:8000/v1/models" 2> /dev/null | grep -q '"muse-glimmer-30b"'; then
          echo "ok $(date -u +%FT%TZ)" > "$R/READY"
          exit 0
        fi
        sleep 15
      done
      fail "vLLM never served muse-glimmer-30b; read docker logs glimmer"
runcmd:
  - [bash, /opt/receipts/gpu-bootstrap.sh]
